name: Revise 4ano 3b Portugues

on:
  push:
    branches:
      - revisao/4ano-3b-portugues-completa-v3
    paths:
      - scripts/revise-4ano-3b-portugues.mjs
      - scripts/normalize-4ano-3b-prompts.mjs
      - tests/portuguese-fourth-grade-third-term-v3.test.mjs
      - .github/workflows/revise-4ano-3b-portugues.yml

permissions:
  contents: write

jobs:
  revise-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar gerador para normalização posterior
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'scripts/revise-4ano-3b-portugues.mjs';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replace('if (ids.size !== 50 || titles.size !== 50 || prompts.size !== 400) {', 'if (ids.size !== 50 || titles.size !== 50) {');
          fs.writeFileSync(p, s);
          NODE
      - name: Gerar revisão editorial
        run: node scripts/revise-4ano-3b-portugues.mjs
      - name: Garantir 400 enunciados únicos
        run: node scripts/normalize-4ano-3b-prompts.mjs
      - name: Validar coleção
        run: node scripts/validate-activity-collection.mjs data/atividades/fundamental-anos-iniciais/4-ano/3-bimestre/lingua-portuguesa.json
      - name: Testar padrão editorial do 3º bimestre
        run: node --test --test-reporter=spec tests/portuguese-fourth-grade-third-term-v3.test.mjs
      - name: Testar compatibilidade dos bimestres 1 a 3
        run: node --test --test-reporter=dot tests/fundamental-term1-3-v2.test.mjs
      - name: Commitar JSON somente se tudo passar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atividades/fundamental-anos-iniciais/4-ano/3-bimestre/lingua-portuguesa.json
          git diff --cached --quiet && exit 0
          git commit -m "Revisa 50 atividades de Português do 4º ano 3º bimestre"
          git push
