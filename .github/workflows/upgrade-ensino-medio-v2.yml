name: Upgrade Ensino Medio V2

on:
  push:
    branches:
      - refactor/ensino-medio-v2
    paths:
      - scripts/upgrade-ensino-medio-v2.py
      - .github/workflows/upgrade-ensino-medio-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/ensino-medio-v2
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar leitor PDF
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Converter 60 colecoes para V2
        run: python scripts/upgrade-ensino-medio-v2.py

      - name: Conferir alteracoes
        run: |
          git status --short
          test -n "$(git status --porcelain data/atividades/ensino-medio)"

      - name: Publicar atividades geradas na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atividades/ensino-medio
          git commit -m "Converte Ensino Medio para 3.000 atividades V2"
          git push origin HEAD:refactor/ensino-medio-v2
