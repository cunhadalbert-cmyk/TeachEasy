name: Repair editorial visual Word staging

on:
  pull_request:
    branches:
      - refactor/consolidate-library
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repair-editorial-visual-word-staging
  cancel-in-progress: true

jobs:
  repair-validate-publish:
    if: github.head_ref == 'automation/editorial-visual-word-audit-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging head
        uses: actions/checkout@v4
        with:
          ref: automation/editorial-visual-word-audit-20260818
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair Science fourth-term V2 metadata
        run: node scripts/repair-science-fourth-term-v2-metadata.mjs

      - name: Repair Geography 4th-year third-term duplicate activity
        run: node scripts/repair-geography-4ano-term3-activity11.mjs

      - name: Run complete validation
        run: npm run validate

      - name: Publish validated staging result
        shell: bash
        run: |
          rm -f docs/auditoria-figuras.md
          git config user.name 'TeachEasy Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add data/atividades/fundamental-anos-iniciais/*-ano/4-bimestre/ciencias.json
          git add data/atividades/fundamental-anos-finais/*-ano/4-bimestre/ciencias.json
          git add data/atividades/fundamental-anos-iniciais/4-ano/3-bimestre/geografia.json
          git diff --cached --quiet && exit 0
          git commit -m 'Staging corrige bloqueios encontrados na auditoria editorial'
          git push origin HEAD:automation/editorial-visual-word-audit-20260818
