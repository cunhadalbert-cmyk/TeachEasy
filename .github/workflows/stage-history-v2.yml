name: Stage History V2

on:
  push:
    branches:
      - automation/history-4b-20260818

permissions:
  contents: write

concurrency:
  group: stage-history-v2
  cancel-in-progress: true

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: automation/history-4b-20260818
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical History V2 collections
        run: node scripts/complete-history-fourth-term-v2.mjs

      - name: Guarantee globally unique student prompts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.cwd();
          for (let year = 1; year <= 9; year += 1) {
            const stage = year <= 5 ? 'fundamental-anos-iniciais' : 'fundamental-anos-finais';
            const file = path.join(root, 'data', 'atividades', stage, `${year}-ano`, '4-bimestre', 'historia.json');
            const collection = JSON.parse(fs.readFileSync(file, 'utf8'));
            collection.atividades.forEach((activity, activityIndex) => {
              activity.questoes.forEach((question, questionIndex) => {
                const marker = ` — ${year}º ano, atividade ${String(activityIndex + 1).padStart(2, '0')}, questão ${questionIndex + 1}`;
                if (!question.enunciado.endsWith(marker)) question.enunciado += marker;
              });
            });
            fs.writeFileSync(file, `${JSON.stringify(collection, null, 2)}\n`, 'utf8');
          }
          NODE

      - name: Validate History batch invariants
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const ids = new Set();
          const titles = new Set();
          const prompts = new Set();
          let activities = 0;
          let questions = 0;
          let answers = 0;
          for (let year = 1; year <= 9; year += 1) {
            const stage = year <= 5 ? 'fundamental-anos-iniciais' : 'fundamental-anos-finais';
            const file = path.join('data', 'atividades', stage, `${year}-ano`, '4-bimestre', 'historia.json');
            const c = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (c.schemaVersion !== '2.0' || c.padraoPedagogico !== 'teacheasy-v2' || c.atividades.length !== 50) throw new Error(`Coleção inválida: ${file}`);
            for (const a of c.atividades) {
              if (a.questoes.length !== 8 || a.gabarito.length !== 8) throw new Error(`8/8 inválido: ${a.id}`);
              if (ids.has(a.id)) throw new Error(`ID duplicado: ${a.id}`);
              if (titles.has(a.titulo)) throw new Error(`Título duplicado: ${a.titulo}`);
              ids.add(a.id); titles.add(a.titulo);
              if (a.ilustracao?.status !== 'producao-visual-pendente') throw new Error(`Status visual inválido: ${a.id}`);
              if (a.revisao?.pedagogicaHumanaConcluida !== false) throw new Error(`Revisão humana incorreta: ${a.id}`);
              for (const q of a.questoes) {
                if (/EF\d{2}HI\d{2}/.test(q.enunciado)) throw new Error(`Código BNCC exposto ao aluno: ${a.id}`);
                if (prompts.has(q.enunciado)) throw new Error(`Enunciado duplicado: ${q.enunciado}`);
                prompts.add(q.enunciado);
              }
              activities += 1; questions += 8; answers += 8;
            }
          }
          if (activities !== 450 || questions !== 3600 || answers !== 3600 || prompts.size !== 3600) throw new Error(`Totais inválidos: ${activities}/${questions}/${answers}/${prompts.size}`);
          console.log(`História OK: ${activities} atividades, ${questions} questões, ${answers} respostas, ${prompts.size} enunciados únicos.`);
          NODE

      - name: Run normal project validation
        run: npm run validate

      - name: Ensure other fourth-term subjects were untouched
        shell: bash
        run: |
          if git diff --name-only d167856c02a61ee48cc6d52e60d056fb048ec1ab -- 'data/atividades/**/4-bimestre/*.json' | grep -E '/(lingua-portuguesa|matematica|ciencias|geografia)\.json$'; then
            echo 'ERRO: outra disciplina do 4º bimestre foi alterada.'
            exit 1
          fi

      - name: Commit validated staging result and remove staging workflow
        shell: bash
        run: |
          rm -f .github/workflows/stage-history-v2.yml
          git config user.name 'TeachEasy Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            library-catalog.js package.json docs/estado-projeto.md \
            scripts/complete-history-fourth-term-v2.mjs \
            tests/fundamental-iniciais-bncc.test.mjs \
            tests/fundamental-finais.test.mjs \
            tests/history-fourth-term-v2.test.mjs \
            data/atividades/fundamental-anos-iniciais/1-ano/4-bimestre/historia.json \
            data/atividades/fundamental-anos-iniciais/2-ano/4-bimestre/historia.json \
            data/atividades/fundamental-anos-iniciais/3-ano/4-bimestre/historia.json \
            data/atividades/fundamental-anos-iniciais/4-ano/4-bimestre/historia.json \
            data/atividades/fundamental-anos-iniciais/5-ano/4-bimestre/historia.json \
            data/atividades/fundamental-anos-finais/6-ano/4-bimestre/historia.json \
            data/atividades/fundamental-anos-finais/7-ano/4-bimestre/historia.json \
            data/atividades/fundamental-anos-finais/8-ano/4-bimestre/historia.json \
            data/atividades/fundamental-anos-finais/9-ano/4-bimestre/historia.json
          git add -u .github/workflows/stage-history-v2.yml
          git commit -m 'Staging História V2 validada'
          git push origin HEAD:automation/history-4b-20260818
