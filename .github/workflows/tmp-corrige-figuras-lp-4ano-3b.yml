name: Temp corrige figuras LP 4ano 3b

on:
  push:
    branches:
      - fix/lp-4ano-3b-figuras-especificas
    paths:
      - .github/workflows/tmp-corrige-figuras-lp-4ano-3b.yml

permissions:
  contents: write

jobs:
  corrigir-e-validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Corrigir descrições visuais
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/atividades/fundamental-anos-iniciais/4-ano/3-bimestre/lingua-portuguesa.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const descricoes = {
            "Informação ou opinião?": "Um estudante analisa, na biblioteca escolar, uma notícia impressa sobre a chegada de livros novos, destacando informações verificáveis com marcadores enquanto pilhas de livros catalogados aparecem ao lado.",
            "Produzindo uma notícia escolar": "Dois estudantes observam uma feira de ciências no pátio da escola, com filtro de água, horta em garrafa e maquete de energia solar, enquanto anotam as informações principais para produzir uma notícia.",
            "Descobrindo informações científicas": "Uma abelha pousa em flores e transporta pólen entre elas; ao fundo aparecem plantas com frutos e sementes, mostrando visualmente a relação entre polinização e formação de alimentos.",
            "Organizando informações de uma pesquisa": "Estudantes na biblioteca organizam os resultados de uma pesquisa sobre preferências de leitura em uma tabela e um gráfico visual, com livros de aventura, quadrinhos, contos e poesia ao redor.",
            "Personagens, acontecimentos e sentidos": "Clara encontra uma pequena chave enferrujada perto do canteiro; o avô aponta para um baú antigo no depósito, onde aparecem cartas e fotografias da família.",
            "Escrevendo uma narrativa curta": "Um estudante planeja uma narrativa curta usando três cartões ilustrados que representam início, problema e desfecho, enquanto escreve e revisa o texto no caderno.",
            "Acento, sílaba forte e busca no dicionário": "Na sala de aula, um estudante marca a sílaba forte de palavras em cartões enquanto outro consulta um dicionário aberto; caderno e lápis ficam sobre a mesa.",
            "Quem escreve, para quem e por quê": "Uma estudante escreve uma carta para uma tia, com envelope ao lado e elementos de uma apresentação teatral escolar ao fundo, deixando clara a situação de quem escreve, para quem e com qual finalidade.",
            "Como se organiza um verbete": "Um estudante consulta uma enciclopédia infantil aberta em uma página ilustrada sobre o boto-cor-de-rosa e observa blocos visuais de título, definição e curiosidades sem texto legível.",
            "Versos, estrofes e o som das palavras": "Uma criança observa a chuva batendo no telhado e molhando uma goiabeira, enquanto um tênis pendurado e pequenos filetes de água na calçada reproduzem a cena descrita no poema.",
            "Meu ponto de vista, na ordem certa": "Uma estudante chega preocupada ao portão da escola enquanto a turma participa de uma apresentação de dança ao fundo; a cena destaca a sequência dos acontecimentos e a mudança de expectativa da personagem.",
            "Conflito e desfecho no conto popular": "Vovó Chica serve café usando uma cuia especial enquanto um vizinho observa a cena; os gestos dos personagens sugerem o conflito e a atitude generosa que conduz ao desfecho do conto.",
            "Perguntar para descobrir": "Uma criança repórter entrevista Seu Raimundo, um carteiro experiente, segurando um bloco de perguntas enquanto ele responde ao lado de sua bolsa de correspondências.",
            "Travessão, dois-pontos e a fala das personagens": "Marina e Téo conversam no corredor da escola; Marina faz um gesto de pergunta e Téo responde segurando um livro, destacando visualmente a alternância das falas sem texto escrito.",
            "Palavras que evitam repetição": "Duas crianças revisam um texto sobre um cachorro da praça; cartões visuais com o mesmo animal e setas ajudam a representar diferentes formas de retomá-lo no texto sem repetição excessiva.",
            "Escrever e revisar um parágrafo claro": "Um estudante revisa cuidadosamente um parágrafo sobre a horta escolar, reorganizando frases no caderno e comparando o texto com uma pequena imagem da horta.",
            "Aprofundamento 31: Notícia": "Um estudante analisa uma notícia impressa e usa quatro marcações visuais para identificar o acontecimento, os participantes, o local e o momento, sem qualquer resposta escrita na imagem.",
            "Aprofundamento 32: Notícia": "Dois estudantes organizam cartões que representam manchete, imagem, lide e corpo de uma notícia, discutindo a ordem adequada das partes sobre uma mesa.",
            "Aprofundamento 33: Notícia": "Um pequeno grupo planeja uma notícia escolar a partir de fotografias de um acontecimento e fichas de anotações, selecionando quais informações devem aparecer no texto.",
            "Aprofundamento 34: Divulgação científica": "Estudantes exploram um material de divulgação científica infantil, observando imagens, evidências e um pequeno experimento enquanto registram descobertas no caderno.",
            "Aprofundamento 35: Pesquisa e registro": "Um estudante compara uma tabela, um gráfico de barras e um diagrama simples com os mesmos dados de uma pesquisa escolar, registrando conclusões no caderno.",
            "Aprofundamento 36: Texto literário": "Uma estudante lê um livro de narrativa e organiza cartões ilustrados para personagem, cenário e acontecimentos principais, relacionando esses elementos ao texto literário.",
            "Aprofundamento 37: Produção textual": "Um estudante planeja uma narrativa ficcional com cartões de sequência de eventos e detalhes de personagens, depois escreve e revisa o primeiro parágrafo no caderno.",
            "Aprofundamento 38: Ortografia e acentuação": "Um estudante separa cartões de palavras conforme a sílaba tônica e confere acentos gráficos em um dicionário aberto, com lápis e caderno de revisão ao lado.",
            "Aprofundamento 39: Carta pessoal": "Uma criança escreve uma carta pessoal em uma folha, com envelope e fotografia familiar ao lado, revisando a organização típica do gênero antes de fechar a correspondência.",
            "Aprofundamento 40: Verbete de enciclopédia": "Dois estudantes montam a estrutura de um verbete de enciclopédia infantil com uma imagem central e blocos visuais separados para título, definição, detalhes e curiosidades, sem texto legível.",
            "Aprofundamento 41: Poema": "Uma estudante lê um poema ilustrado e marca visualmente pares de rimas e divisões entre estrofes com tiras coloridas, mantendo versos e palavras sem legibilidade.",
            "Aprofundamento 42: História em quadrinhos": "Dois estudantes analisam uma história em quadrinhos de três quadros com personagens em ação, balões e sinais gráficos sem texto legível, relacionando imagens, gestos e sequência narrativa.",
            "Aprofundamento 43: Texto instrucional": "Um estudante segue cartões ilustrados em sequência para montar um brinquedo simples de papel, com materiais organizados sobre a mesa e cada etapa representada visualmente.",
            "Aprofundamento 44: Relato pessoal": "Uma estudante organiza fotografias de uma experiência escolar em ordem cronológica e relata o acontecimento a um colega, enquanto registra no caderno sua própria perspectiva sobre os fatos.",
            "Aprofundamento 45: Conto popular brasileiro": "Crianças leem um conto popular brasileiro e organizam quatro cartões ilustrados para cenário, personagem principal, conflito e resolução, acompanhando a sequência da narrativa.",
            "Aprofundamento 46: Entrevista": "Um estudante entrevista um funcionário da escola usando um roteiro de perguntas e um gravador simples, enquanto o entrevistado responde e o colega registra as informações.",
            "Aprofundamento 47: Campanha educativa": "Estudantes analisam um cartaz de campanha educativa escolar e cartões com afirmações, separando visualmente informações verificáveis de opiniões ou sugestões sem mostrar respostas.",
            "Aprofundamento 48: Pontuação em diálogos": "Marina e Téo conversam no corredor da escola; Marina faz um gesto de pergunta e Téo responde com um livro nas mãos, destacando turnos de fala e diferentes entonações sem texto legível.",
            "Aprofundamento 49: Coesão textual": "Um estudante revisa um parágrafo e usa setas e cartões visuais para ligar diferentes palavras e pronomes ao mesmo personagem, mostrando como as retomadas mantêm a continuidade do texto.",
            "Aprofundamento 50: Produção e revisão de parágrafo": "Um estudante revisa um texto em tiras de frases, reorganizando ideias, marcando o início de parágrafos e passando a versão final para o caderno de forma clara e ordenada."
          };
          if (!Array.isArray(data.atividades) || data.atividades.length !== 50) throw new Error(`Esperadas 50 atividades; encontrado ${data.atividades?.length}.`);
          const genericas = data.atividades.filter(a => (a.figuras || []).some(f => /Ilustração relacionada a/i.test(f.descricao || '')) || /Ilustração relacionada a/i.test(a.ilustracao?.descricao || ''));
          if (genericas.length !== 36) throw new Error(`Esperadas 36 atividades com placeholder; encontrado ${genericas.length}.`);
          const faltantes = genericas.filter(a => !descricoes[a.titulo]).map(a => a.titulo);
          if (faltantes.length) throw new Error(`Sem descrição específica para: ${faltantes.join(' | ')}`);
          const alteradas = new Set();
          for (const atividade of genericas) {
            const descricao = descricoes[atividade.titulo];
            for (const figura of atividade.figuras || []) {
              if (/Ilustração relacionada a/i.test(figura.descricao || '')) {
                figura.descricao = descricao;
                figura.textoAlternativo = descricao;
              }
            }
            if (/Ilustração relacionada a/i.test(atividade.ilustracao?.descricao || '')) atividade.ilustracao.descricao = descricao;
            alteradas.add(atividade.titulo);
          }
          const sentimentos = data.atividades.find(a => a.titulo === 'Inferindo sentimentos pela imagem');
          if (!sentimentos) throw new Error('Atividade “Inferindo sentimentos pela imagem” não encontrada.');
          const descricaoSentimentos = 'Sequência de três cenas: Nina mostra seu desenho sorrindo a um colega; uma rajada de vento leva a folha e Nina se assusta; o colega alcança a folha junto ao portão e a devolve, deixando Nina aliviada.';
          for (const figura of sentimentos.figuras || []) {
            figura.descricao = descricaoSentimentos;
            figura.textoAlternativo = descricaoSentimentos;
          }
          if (sentimentos.ilustracao) sentimentos.ilustracao.descricao = descricaoSentimentos;
          alteradas.add(sentimentos.titulo);
          const placeholders = [];
          for (const atividade of data.atividades) {
            for (const figura of atividade.figuras || []) if (/Ilustração relacionada a/i.test(figura.descricao || '')) placeholders.push(`${atividade.titulo}/figuras`);
            if (/Ilustração relacionada a/i.test(atividade.ilustracao?.descricao || '')) placeholders.push(`${atividade.titulo}/ilustracao`);
            if (atividade.quantidadeQuestoes !== 8 || atividade.questoes?.length !== 8 || atividade.gabarito?.length !== 8) throw new Error(`Estrutura de 8 questões/gabarito alterada em: ${atividade.titulo}`);
          }
          if (placeholders.length) throw new Error(`Placeholders restantes: ${placeholders.join(' | ')}`);
          if (alteradas.size !== 37) throw new Error(`Esperadas 37 atividades corrigidas; encontrado ${alteradas.size}.`);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n', 'utf8');
          console.log(`OK: ${alteradas.size} atividades visuais corrigidas; 0 placeholders restantes.`);
          NODE
      - name: Validar coleção
        run: npm run validate:portugues-4ano-3b
      - name: Confirmar ausência de placeholders
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/atividades/fundamental-anos-iniciais/4-ano/3-bimestre/lingua-portuguesa.json';
          const raw = fs.readFileSync(p, 'utf8');
          if (/Ilustração relacionada a/i.test(raw)) throw new Error('Ainda existe placeholder visual no JSON.');
          if (!raw.includes('uma rajada de vento leva a folha')) throw new Error('Correção de “Inferindo sentimentos” não encontrada.');
          console.log('Validação visual textual: OK');
          NODE
      - name: Commitar correção e remover workflow temporário
        run: |
          rm .github/workflows/tmp-corrige-figuras-lp-4ano-3b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atividades/fundamental-anos-iniciais/4-ano/3-bimestre/lingua-portuguesa.json .github/workflows/tmp-corrige-figuras-lp-4ano-3b.yml
          git commit -m "Corrige descrições visuais do Português 4º ano 3º bimestre"
          git push
