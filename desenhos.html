<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="300 desenhos para colorir em folha A4 no TeachEasy.">
  <title>300 desenhos para colorir — TeachEasy</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="coloring-pages.css">
  <style>
    .coloring-page-main { min-height: 75vh; padding: 42px 0 64px; background: #fffaf7; }
    .coloring-page-heading { margin-bottom: 26px; }
    .coloring-page-heading h1 { margin: 0 0 8px; color: #4a0715; font-size: clamp(2rem, 5vw, 3.4rem); }
    .coloring-page-heading p { margin: 0; max-width: 760px; font-size: 1.1rem; line-height: 1.6; }
    .coloring-back { display: inline-flex; margin-bottom: 22px; }
    @media (max-width: 680px) {
      .coloring-page-main { padding: 26px 0 44px; }
      .coloring-page-heading p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Página inicial TeachEasy">
        <strong>TeachEasy</strong>
        <span>O caminho mais rápido do professor.</span>
      </a>
    </div>
  </header>
  <main id="conteudo" class="coloring-page-main">
    <div class="container">
      <a class="btn btn-outline coloring-back" href="index.html">← Voltar ao início</a>
      <header class="coloring-page-heading">
        <h1>300 desenhos para colorir</h1>
        <p>Escolha uma das seis categorias. Cada desenho ocupa uma folha A4 inteira e pode ser visualizado, baixado ou impresso.</p>
      </header>
      <section id="coloring-library" aria-label="Biblioteca de desenhos para colorir"></section>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <strong>TeachEasy</strong>
      <span>O caminho mais rápido do professor.</span>
    </div>
  </footer>
  <script src="coloring-pages.js"></script>
  <script>
    const library = document.querySelector('#coloring-library');
    if (window.ColoringPages && window.ColoringPages.total === 300) {
      window.ColoringPages.renderLibrary(library);
    } else {
      library.innerHTML = '<p role="alert">Não foi possível carregar os desenhos.</p>';
    }
  </script>
</body>
</html>
