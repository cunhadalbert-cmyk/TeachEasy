<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Associação de Imagens | TeachEasy</title>
  <meta name="description" content="Atividade pedagógica de ligar pares e associação de imagens.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Libre+Franklin:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6d1027;
      --bg: #fff8f3;
      --accent: #2a9d8f;
      --border: #e6edd8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: #20352b; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #fff; border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .back-btn { text-decoration: none; color: var(--primary); font-weight: 800; font-size: 0.95rem; }
    .print-btn { background: var(--primary); color: #fff; border: 0; border-radius: 99px; padding: 10px 20px; font-weight: 800; cursor: pointer; }
    
    main { max-width: 800px; width: calc(100% - 32px); margin: 32px auto; flex: 1; }
    .game-header { text-align: center; margin-bottom: 28px; }
    .game-header h1 { font-family: 'Libre Franklin', sans-serif; font-size: 2.5rem; color: var(--primary); margin-bottom: 8px; }
    
    .matching-container { background: #fff; border-radius: 24px; border: 2px solid var(--border); padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    .pair-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding: 12px 24px; background: #f9fbf5; border: 2px solid #e1ebda; border-radius: 16px; }
    .item-box { font-size: 3rem; display: flex; align-items: center; gap: 12px; font-weight: 800; }
    .connector-line { flex: 1; border-top: 3px dashed var(--accent); margin: 0 24px; }

    @media print {
      header, .print-btn { display: none; }
      body { background: #fff; }
      .matching-container { border: 0; box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>

  <header>
    <a href="../jogos.html" class="back-btn">← Voltar aos Jogos</a>
    <strong>TeachEasy • Associação de Imagens</strong>
    <button class="print-btn" onclick="window.print()">🖨 Imprimir Atividade</button>
  </header>

  <main>
    <div class="game-header">
      <h1>🔗 Ligue os Pares Correspondentes</h1>
      <p>Ligue o animal ao seu alimento correto!</p>
    </div>

    <div class="matching-container">
      <div class="pair-row">
        <div class="item-box">🐝 <span style="font-size:1.2rem;">Abelha</span></div>
        <div class="connector-line"></div>
        <div class="item-box">🍯 <span style="font-size:1.2rem;">Mel</span></div>
      </div>

      <div class="pair-row">
        <div class="item-box">🐸 <span style="font-size:1.2rem;">Sapo</span></div>
        <div class="connector-line"></div>
        <div class="item-box">🪷 <span style="font-size:1.2rem;">Vitória-Régia</span></div>
      </div>

      <div class="pair-row">
        <div class="item-box">🐰 <span style="font-size:1.2rem;">Coelho</span></div>
        <div class="connector-line"></div>
        <div class="item-box">🥕 <span style="font-size:1.2rem;">Cenoura</span></div>
      </div>

      <div class="pair-row">
        <div class="item-box">🐻 <span style="font-size:1.2rem;">Urso</span></div>
        <div class="connector-line"></div>
        <div class="item-box">🐟 <span style="font-size:1.2rem;">Peixe</span></div>
      </div>
    </div>
  </main>

  <footer style="text-align:center; padding:24px; color:#88998f; font-size:0.85rem;">
    <p>© TeachEasy • Plataforma de Recursos Didáticos para Educadores</p>
  </footer>

</body>
</html>
